<circle cx="266" cy="188" r="4" fill="#fff" stroke="#e0a04a" stroke-width=".5"/><text x="266" y="189.8" font-size="5" text-anchor="middle" fill="#1b1f24">1</text><text x="274" y="189.8" font-size="5" fill="#1b1f24">叶形握把：外轮廓取 Logo 下叶的弧线，末端收尖并向内卷</text><circle cx="266" cy="199" r="4" fill="#fff" stroke="#e0a04a" stroke-width=".5"/><text x="266" y="200.8" font-size="5" text-anchor="middle" fill="#1b1f24">2</text><text x="274" y="200.8" font-size="5" fill="#1b1f24">握把中脉：一条细凹槽，对应 Logo 叶片的叶脉</text><circle cx="266" cy="210" r="4" fill="#fff" stroke="#e0a04a" stroke-width=".5"/><text x="266" y="211.8" font-size="5" text-anchor="middle" fill="#1b1f24">3</text><text x="274" y="211.8" font-size="5" fill="#1b1f24">Home 键：圆键，鱼形月牙与眼点为琥珀色呼吸灯</text><circle cx="266" cy="221" r="4" fill="#fff" stroke="#e0a04a" stroke-width=".5"/><text x="266" y="222.8" font-size="5" text-anchor="middle" fill="#1b1f24">4</text><text x="274" y="222.8" font-size="5" fill="#1b1f24">中央 Logo：与外壳同色的浅凹印，不加底板</text><circle cx="266" cy="232" r="4" fill="#fff" stroke="#e0a04a" stroke-width=".5"/><text x="266" y="233.8" font-size="5" text-anchor="middle" fill="#1b1f24">5</text><text x="274" y="233.8" font-size="5" fill="#1b1f24">主按键：四个圆键，仅确认键带琥珀色细环</text><circle cx="266" cy="243" r="4" fill="#fff" stroke="#e0a04a" stroke-width=".5"/><text x="266" y="244.8" font-size="5" text-anchor="middle" fill="#1b1f24">6</text><text x="274" y="244.8" font-size="5" fill="#1b1f24">握把之间的凹弧：对应 Logo 中鱼的月牙</text><circle cx="266" cy="254" r="4" fill="#fff" stroke="#e0a04a" stroke-width=".5"/><text x="266" y="255.8" font-size="5" text-anchor="middle" fill="#1b1f24">7</text><text x="274" y="255.8" font-size="5" fill="#1b1f24">下壳与肩键：石墨色，分模线从肩部斜向握把尖</text>
